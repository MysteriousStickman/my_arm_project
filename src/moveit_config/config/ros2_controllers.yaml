# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - Joint1
      - Joint2
      - Joint3
      - Joint4
      - Joint5
      - Joint6
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity

    # Real-time control settings
    state_publish_rate: 200.0  # Publish state at controller update rate
    action_monitor_rate: 20.0   # Monitor action goal progress
    
    open_loop_control: false  # Use feedback for better control
    allow_integration_in_goal_trajectories: true

    # Constraints for trajectory execution
    constraints:
      stopped_velocity_tolerance: 0.01  # Velocity threshold to consider stopped
      goal_time: 3.0  # Allow up to 3 seconds after trajectory end to meet goal tolerances
      Joint1: {goal: 0.01}  # 增加成功判定条件，不会改变电机的控制精度  每轴到位误差允许 0.01 rad，约 0.57°，作为当前的初步验收阈值
      Joint2: {goal: 0.01}
      Joint3: {goal: 0.01}
      Joint4: {goal: 0.01}
      Joint5: {goal: 0.01}
      Joint6: {goal: 0.01}
gripper_controller:
  ros__parameters:
    joints:
      - Gripper
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
